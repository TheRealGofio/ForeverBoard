name: Release Addon (WowUp & GitHub)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Addon for WowUp
        run: |
          mkdir -p package/ForeverBoard
          cp -r Core.lua UI.lua Sounds.lua ForeverBoard.toc README.md CHANGELOG.md sounds actualizar_sonidos.bat package/ForeverBoard/
          cd package
          zip -r ../ForeverBoard.zip ForeverBoard
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ForeverBoard.zip
          name: ForeverBoard ${{ github.ref_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
